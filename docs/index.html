<style>
  :root {
    --paper: #FBFAF7; --paper2: #ECE8DF; --ink: #42331E;
    --sub: #8C7A52; --gold: #F2B23B; --line: #CBB585;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", sans-serif;
    background: #141210; color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .stamp {
    max-width: 560px; width: 100%;
    background: linear-gradient(var(--paper), var(--paper2));
    border-radius: 18px; padding: 48px 36px;
    border: 2px dashed var(--line);
    outline: 10px solid rgba(251, 250, 247, .06);
  }
  .mark {
    font-size: 13px; font-weight: 800; letter-spacing: .35em;
    color: var(--sub); text-transform: uppercase;
  }
  h1 { font-size: 44px; font-weight: 900; margin: 10px 0 6px; }
  h1 .emoji { margin-right: 8px; }
  .tagline { font-size: 17px; color: var(--sub); font-weight: 600; margin-bottom: 28px; }
  p.desc { font-size: 15px; line-height: 1.75; margin-bottom: 32px; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: 13px 22px; border-radius: 999px;
    font-size: 15px; font-weight: 700; text-decoration: none;
  }
  a.primary { background: linear-gradient(#FFE08A, var(--gold)); color: #3A2C12; }
  a.ghost { border: 1.5px solid var(--line); color: var(--sub); }
  .postmark {
    margin-top: 40px; font-size: 12px; color: var(--sub);
    border-top: 1px dashed var(--line); padding-top: 16px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .postmark a { color: var(--sub); }
</style>
</head>
<body>
  <main class="stamp">
    <div class="mark">Stamp Camera</div>
    <h1><span class="emoji">📮</span>펀칭</h1>
    <p class="tagline">꾹 눌러 뜯은 순간을 움직이는 스티커로.</p>
    <p class="desc">
      펀칭기로 꾹 눌러 본 장면을 움직이는 스티커로 뜯어내는 iOS 카메라 앱입니다.
      대상만 오려 내거나 톱니 우표 모양으로 뜯고, 수집함에 모아
      메시지·키보드로 보내거나 진짜 스티커로 인쇄할 수 있어요.
    </p>
    <div class="links">

  </main>
